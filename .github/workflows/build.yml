name: NeoForge build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify pure Java magazine and manufacturing rules
        run: |
          mkdir -p build/logic-checks
          javac -d build/logic-checks \
            src/main/java/dev/pragmaticfirearms/core/MagazineRules.java \
            src/main/java/dev/pragmaticfirearms/core/AmmoCatalog.java \
            src/main/java/dev/pragmaticfirearms/core/ManufacturingCatalog.java \
            src/test/java/dev/pragmaticfirearms/core/MagazineRulesTest.java \
            src/test/java/dev/pragmaticfirearms/core/ManufacturingCatalogTest.java
          java -ea -cp build/logic-checks dev.pragmaticfirearms.core.MagazineRulesTest
          java -ea -cp build/logic-checks dev.pragmaticfirearms.core.ManufacturingCatalogTest
      - name: Compile and package mod
        run: gradle build --no-daemon --stacktrace
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pragmatic-firearms-dev
          path: build/libs/*.jar
